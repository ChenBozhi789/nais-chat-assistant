# Which implementation runs is chosen in the Dockerfile (the CMD line).
# Keep this file in sync: the "IMPL 3 / 4" env vars below serve both impl 3 and
# impl 4 (same agent and MCP settings), or use the "IMPL 1" block (commented
# out) with CMD for impl 1.
services:
  - type: web
    name: nais-chat-assistant
    runtime: docker
    plan: starter # free plan sleeps after 15 min idle; starter stays awake
    healthCheckPath: /health
    envVars:
      # Secrets: set these in the Render dashboard (sync: false = not stored in git).

      # --- IMPL 3 / IMPL 4: Foundry agent + remote MCP (impl 3 currently active) ---
      # Entra ID service principal; DefaultAzureCredential reads these three.
      # It needs a role on the Foundry project that allows calling agents
      # (e.g. Azure AI User).
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: FOUNDRY_PROJECT_ENDPOINT
        sync: false
      - key: FOUNDRY_MCP_AGENT_NAME
        sync: false
      # Server label of the MCP tool in the Foundry portal. If empty, every MCP
      # approval request is denied and the agent cannot read documents.
      - key: FOUNDRY_MCP_SERVER_LABEL
        sync: false
      - key: FOUNDRY_MCP_APPROVED_TOOLS
        value: list_documents,read_document
      # An agent needs several tool rounds, so allow more than the 20 s default.
      - key: LLM_TIMEOUT_SECONDS
        value: "60"

      # --- IMPL 2: Foundry agent + File Search (uncomment with its CMD) ---
      # - key: AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET  (as above)
      # - key: FOUNDRY_PROJECT_ENDPOINT
      #   sync: false
      # - key: FOUNDRY_FILE_SEARCH_AGENT_NAME
      #   sync: false

      # --- IMPL 1: Chat completions + Chroma (uncomment with its CMD and COPY) ---
      # - key: FOUNDRY_OPENAI_BASE_URL
      #   sync: false
      # - key: FOUNDRY_API_KEY
      #   sync: false
      # - key: FOUNDRY_CHAT_DEPLOYMENT
      #   sync: false
      # - key: FOUNDRY_EMBEDDING_DEPLOYMENT
      #   sync: false
      # - key: CHROMA_COLLECTION
      #   value: nais-chroma-practice

      # --- Shared by all implementations ---
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      # Speech-to-text and text-to-speech endpoints of the AI Services resource.
      - key: AZURE_SPEECH_ENDPOINT
        sync: false
      - key: AZURE_SPEECH_STT_ENDPOINT
        sync: false
      - key: NAIS_CONTACT_INFO
        value: Please contact the NAIS team via the contact page on the website.
      # Add your test page origin(s), comma-separated. The Render URL itself is
      # included so the bundled test page works.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_LOCALHOST
        value: "false"
      - key: RATE_LIMIT
        value: 20/minute
